<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" role="img" aria-labelledby="title desc"><title id="title">光線反射與法線</title><desc id="desc">藍色入射光線與橘色反射光線分居法線兩側。兩個角度均由法線量起，入射角等於反射角。</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#2b7fc1" stroke-width="1.5"/></marker><marker id="coral" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#e16f50" stroke-width="1.5"/></marker></defs><rect width="820" height="390" fill="#fffdf8"/><rect x="45" y="302" width="730" height="45" fill="#edf4f1"/><path d="M45 302H775" stroke="#16302d" stroke-width="5"/><g stroke="#8ea59c" stroke-width="2"><path d="M80 304l-18 20m80-20l-18 20m80-20l-18 20m80-20l-18 20m80-20l-18 20m80-20l-18 20m80-20l-18 20m80-20l-18 20m80-20l-18 20m80-20l-18 20m80-20l-18 20"/></g><path d="M410 44V302" stroke="#627773" stroke-width="2" stroke-dasharray="7 7"/><path d="M273 106L410 302" stroke="#2b7fc1" stroke-width="4" fill="none" marker-end="url(#blue)"/><path d="M410 302L547 106" stroke="#e16f50" stroke-width="4" fill="none" marker-end="url(#coral)"/><path d="M370 245A70 70 0 0 1 410 232" stroke="#2b7fc1" fill="none" stroke-width="2"/><path d="M410 212A90 90 0 0 1 462 228" stroke="#e16f50" fill="none" stroke-width="2"/><circle cx="410" cy="302" r="5" fill="#b87916"/><g font-family="PingFang TC,Microsoft JhengHei,sans-serif" font-size="24" fill="#16302d"><text x="429" y="63">① 法線</text><text x="128" y="115" fill="#2b7fc1">入射光線</text><text x="580" y="115" fill="#e16f50">反射光線</text><text x="330" y="223" fill="#2b7fc1">θᵢ</text><text x="456" y="201" fill="#e16f50">θᵣ</text><text x="406" y="373" text-anchor="middle">固定平面鏡</text><text x="90" y="247" font-size="21">② 兩個角都由</text><text x="90" y="275" font-size="21">法線量起</text><text x="110" y="45" font-size="21">③ 箭頭表示光的傳播方向</text></g></svg>